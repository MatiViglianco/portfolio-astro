<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
  <title id="title">Impacto medido de la optimización</title>
  <desc id="desc">Reducción del 43 por ciento de tokens, eliminación de filas repetidas y cobertura automatizada.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07111f"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><linearGradient id="bar"><stop stop-color="#a855f7"/><stop offset="1" stop-color="#38bdf8"/></linearGradient></defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <text x="48" y="60" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">Impacto medido</text>
  <text x="48" y="88" fill="#94a3b8" font-family="Segoe UI,Arial,sans-serif" font-size="15">Corrida representativa · métricas agregadas sanitizadas</text>
  <g transform="translate(48 130)" font-family="Segoe UI,Arial,sans-serif">
    <rect width="704" height="210" rx="18" fill="#111827" stroke="#334155"/>
    <text x="24" y="39" fill="#e2e8f0" font-size="19" font-weight="700">Tokens de entrada</text>
    <text x="24" y="82" fill="#94a3b8" font-size="14">Antes</text><rect x="92" y="63" width="545" height="25" rx="12" fill="#3f3f46"/><text x="625" y="82" text-anchor="end" fill="#fff" font-size="14" font-weight="700">15.620</text>
    <text x="24" y="132" fill="#94a3b8" font-size="14">Después</text><rect x="92" y="113" width="314" height="25" rx="12" fill="url(#bar)"/><text x="394" y="132" text-anchor="end" fill="#fff" font-size="14" font-weight="700">9.014</text>
    <text x="24" y="185" fill="#c4b5fd" font-size="38" font-weight="800">−43%</text><text x="146" y="184" fill="#cbd5e1" font-size="17">menos contexto de entrada</text>
  </g>
  <g transform="translate(48 372)" font-family="Segoe UI,Arial,sans-serif">
    <g><rect width="218" height="130" rx="16" fill="#111827" stroke="#334155"/><text x="18" y="37" fill="#94a3b8" font-size="14">Filas repetidas</text><text x="18" y="86" fill="#fff" font-size="34" font-weight="800">46 → 0</text><text x="18" y="111" fill="#4ade80" font-size="14">eliminadas</text></g>
    <g transform="translate(243)"><rect width="218" height="130" rx="16" fill="#111827" stroke="#334155"/><text x="18" y="37" fill="#94a3b8" font-size="14">Payload</text><text x="18" y="86" fill="#fff" font-size="34" font-weight="800">−14%</text><text x="18" y="111" fill="#38bdf8" font-size="14">menos datos enviados</text></g>
    <g transform="translate(486)"><rect width="218" height="130" rx="16" fill="#111827" stroke="#334155"/><text x="18" y="37" fill="#94a3b8" font-size="14">Cobertura</text><text x="18" y="86" fill="#fff" font-size="34" font-weight="800">160+</text><text x="18" y="111" fill="#c4b5fd" font-size="14">pruebas automatizadas</text></g>
  </g>
  <text x="48" y="552" fill="#64748b" font-family="Segoe UI,Arial,sans-serif" font-size="13">Los resultados describen una corrida representativa; no se presentan como benchmark universal.</text>
</svg>
