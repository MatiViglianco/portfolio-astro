    <g transform="translate(298 145)"><rect width="205" height="105" rx="14" fill="#172033" stroke="#334155"/><text x="18" y="35" fill="#e2e8f0" font-size="18" font-weight="700">2 · Normalización</text><text x="18" y="65" fill="#94a3b8" font-size="14">Fechas · importes · IDs</text><text x="18" y="88" fill="#94a3b8" font-size="14">Deduplicación</text></g>
    <g transform="translate(548 145)"><rect width="204" height="105" rx="14" fill="#172033" stroke="#334155"/><text x="18" y="35" fill="#e2e8f0" font-size="18" font-weight="700">3 · Reglas</text><text x="18" y="65" fill="#94a3b8" font-size="14">Matching determinístico</text><text x="18" y="88" fill="#94a3b8" font-size="14">Grafo de candidatos</text></g>
    <g transform="translate(548 310)"><rect width="204" height="105" rx="14" fill="#172033" stroke="#a855f7"/><text x="18" y="35" fill="#e2e8f0" font-size="18" font-weight="700">4 · IA asistida</text><text x="18" y="65" fill="#94a3b8" font-size="14">Solo casos pendientes</text><text x="18" y="88" fill="#94a3b8" font-size="14">Salida validada</text></g>
    <g transform="translate(298 310)"><rect width="205" height="105" rx="14" fill="#172033" stroke="#f59e0b"/><text x="18" y="35" fill="#e2e8f0" font-size="18" font-weight="700">5 · Revisión</text><text x="18" y="65" fill="#94a3b8" font-size="14">Aprobar o corregir</text><text x="18" y="88" fill="#94a3b8" font-size="14">Contexto del revisor</text></g>
